name: Reduce OTA Slot

# GAS から repository_dispatch で呼び出される。
# 予約が入ったとき、じゃらん(ACTIVITY BOARD)の該当枠を減らす。
on:
  repository_dispatch:
    types: [reduce_slot]
  # 手動テスト用（Actionsタブから実行可能）
  workflow_dispatch:
    inputs:
      slot_date:  { description: "対象日 (YYYY-MM-DD)", required: true }
      slot_time:  { description: "対象時間 (HH:MM)",    required: true }
      slot_delta: { description: "増減（-2=減 / +2=戻し）", required: false }
      slot_target_stock: { description: "絶対値：目標残数（指定時はdelta無視）", required: false }
      dry_run:    { description: "true=保存しない",     required: false, default: "true" }

jobs:
  reduce:
    runs-on: ubuntu-latest
    # 既定のジョブ上限は6時間。Chromiumのインストールがハングして5時間以上
    # 枠を占有し、concurrency で後続の実行が全て詰まったことがあるため上限を設ける。
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo   # 枠の日付は日本時間で判定する
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Install Chromium
        timeout-minutes: 10
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Reduce slot (jalan)
        working-directory: automation
        env:
          JALAN_ID:       ${{ secrets.JALAN_ID }}
          JALAN_PASSWORD: ${{ secrets.JALAN_PASSWORD }}
          SLOT_DATE:      ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:      ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          SLOT_DECREMENT: ${{ github.event.client_payload.slot_decrement }}
          SLOT_DELTA:     ${{ github.event.client_payload.slot_delta || github.event.inputs.slot_delta }}
          SLOT_TARGET_STOCK: ${{ github.event.client_payload.slot_target_stock || github.event.inputs.slot_target_stock }}
          DRY_RUN:        ${{ github.event.client_payload.dry_run || github.event.inputs.dry_run || 'true' }}
          DEDUP_KEY:      ${{ github.event.client_payload.dedup_key }}
          HEADLESS:       "true"
        run: node reduce-jalan-slot.js

      # 実行ログ(JSON Lines)とスクショを成功・失敗どちらでも保存
      - name: Upload run log & screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-artifacts-${{ github.run_id }}
          path: |
            automation/run-log.jsonl
            automation/result-screenshot.png
            automation/error-screenshot.png
          if-no-files-found: ignore

      # 在庫連動が失敗したら即LINE ALERT（オーバーブッキング懸念）
      - name: Notify failure to LINE
        if: failure()
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER:  ${{ secrets.LINE_USER_ID }}
          SLOTS:      ${{ toJSON(github.event.client_payload.slots) != 'null' && toJSON(github.event.client_payload.slots) || github.event.inputs.slots }}
          SLOT_DATE:  ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:  ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          SLOT_DELTA: ${{ github.event.client_payload.slot_delta || github.event.inputs.slot_delta }}
          SOURCE_SITE: ${{ github.event.client_payload.source_site }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LINE_TOKEN" ] || [ -z "$LINE_USER" ]; then
            echo "LINE未設定のため通知スキップ"; exit 0
          fi
          # LINEに実際の改行を送る。ダブルクォート内の \n は文字列 "\n" のまま
          # 送られてしまうため、printf %b で改行に展開する。
          # 対象の枠。GASは1枠ずつ(slot_date/slot_time)と一括(slots配列)の
          # 両方の送り方をするため、slots のときも必ず中身を出す。
          # 以前は slot_date しか見ておらず「対象: →」と空欄になっていた。
          if [ -n "$SLOT_DATE" ]; then
            TARGET="${SLOT_DATE} ${SLOT_TIME} ${SLOT_DELTA}名"
          elif [ -n "$SLOTS" ] && [ "$SLOTS" != "null" ]; then
            N=$(printf '%s' "$SLOTS" | jq 'length' 2>/dev/null || echo '?')
            LIST=$(printf '%s' "$SLOTS" | jq -r '[.[] | "\(.date) \(.time)"] | join(", ")' 2>/dev/null | cut -c1-300)
            TARGET="${N}枠 (${LIST})"
          else
            TARGET="(対象不明)"
          fi
          [ -n "$SOURCE_SITE" ] || SOURCE_SITE="不明"
          TEXT=$(printf '%b' "🚨【至急】OTA在庫の連動に失敗しました\n対象: ${TARGET}（発生元: ${SOURCE_SITE}）\n影響: じゃらんの在庫が減っていない可能性 → オーバーブッキング懸念\n👉 じゃらん管理画面で在庫を手動調整してください\nログ: ${RUN_URL}")
          PAYLOAD=$(jq -nc --arg to "$LINE_USER" --arg text "$TEXT" '{to:$to, messages:[{type:"text", text:$text}]}')
          curl -sS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
