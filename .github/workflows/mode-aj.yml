name: Switch Activity Japan Slot Mode

# GAS から repository_dispatch(mode_aj) で呼び出される。
# 残数が限界（残1）に達したら「リクエスト」へ、キャンセルで空きが戻ったら
# 「即予約」へ、アクティビティジャパンの該当枠を切り替える。
on:
  repository_dispatch:
    types: [mode_aj]
  workflow_dispatch:
    inputs:
      slot_date: { description: "対象日 (YYYY-MM-DD)", required: true }
      slot_time: { description: "対象時間 (HH:MM)",    required: true }
      mode:      { description: "request=リクエスト化 / immediate=即予約化", required: true }
      stock:     { description: "即予約化のとき設定する在庫数",  required: false, default: "0" }
      dry_run:   { description: "true=保存しない",     required: false, default: "true" }
      slots:     { description: "一括JSON配列（指定時は上記より優先）", required: false, default: "" }
      notify:    { description: "false=失敗してもLINE通知しない（検証用）", required: false, default: "true" }
      allow_reopen_closed: { description: "true=「開催なし」の枠も変更する（手動復旧用）", required: false, default: "false" }

concurrency:
  group: ota-sync-aj       # 在庫減算(reduce-aj)と同時にAJへログインしない
  cancel-in-progress: false

jobs:
  switch-mode:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo   # 枠の日付は日本時間で判定する
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Switch slot mode (activity japan)
        working-directory: automation
        env:
          AJ_ID:       ${{ secrets.AJ_ID }}
          AJ_PASSWORD: ${{ secrets.AJ_PASSWORD }}
          SLOTS:      ${{ toJSON(github.event.client_payload.slots) != 'null' && toJSON(github.event.client_payload.slots) || github.event.inputs.slots }}
          SLOT_DATE:  ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:  ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          MODE:       ${{ github.event.client_payload.mode || github.event.inputs.mode }}
          STOCK:      ${{ github.event.client_payload.stock || github.event.inputs.stock || '0' }}
          DRY_RUN:    ${{ github.event.client_payload.dry_run || github.event.inputs.dry_run || 'true' }}
          ALLOW_REOPEN_CLOSED: ${{ github.event.inputs.allow_reopen_closed || 'false' }}
          HEADLESS:   "true"
        run: node mode-aj-slot.js

      - name: Upload run log & screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aj-mode-artifacts-${{ github.run_id }}
          path: |
            automation/run-log-aj-mode.jsonl
            automation/result-aj-mode.png
            automation/error-aj-mode.png
          if-no-files-found: ignore

      - name: Notify failure to LINE
        if: failure() && github.event.inputs.notify != 'false'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER:  ${{ secrets.LINE_USER_ID }}
          SLOT_DATE:  ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:  ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          MODE:       ${{ github.event.client_payload.mode || github.event.inputs.mode }}
          SOURCE_SITE: ${{ github.event.client_payload.source_site }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LINE_TOKEN" ] || [ -z "$LINE_USER" ]; then
            echo "LINE未設定のため通知スキップ"; exit 0
          fi
          TEXT="🚨【至急】アクティビティジャパンの枠モード切替に失敗しました\n対象: ${SLOT_DATE} ${SLOT_TIME} → ${MODE}（発生元: ${SOURCE_SITE}）\n影響: 即予約/リクエストの状態が想定と異なる可能性\n👉 AJ管理画面で枠状態を手動確認してください\nログ: ${RUN_URL}"
          PAYLOAD=$(jq -nc --arg to "$LINE_USER" --arg text "$TEXT" '{to:$to, messages:[{type:"text", text:$text}]}')
          curl -sS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
