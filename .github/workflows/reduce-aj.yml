name: Reduce Activity Japan Slot

# GAS から repository_dispatch(reduce_aj) で呼び出される。
# 予約が入ったとき、アクティビティジャパンの該当枠を増減する。
on:
  repository_dispatch:
    types: [reduce_aj]
  workflow_dispatch:
    inputs:
      slot_date:  { description: "対象日 (YYYY-MM-DD)", required: true }
      slot_time:  { description: "対象時間 (HH:MM)",    required: true }
      slot_delta: { description: "増減（-2=減 / +2=戻し）", required: false }
      slot_target_stock: { description: "絶対値：目標在庫（指定時はdelta無視）", required: false }
      dry_run:    { description: "true=保存しない",     required: false, default: "true" }
      diag_fields: { description: "true=フォーム入力欄を洗い出すだけ（保存しない）", required: false, default: "false" }
      notify:     { description: "false=失敗してもLINE通知しない（検証用）", required: false, default: "true" }

concurrency:
  group: ota-sync-aj
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo   # 枠の日付は日本時間で判定する
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Adjust slot (activity japan)
        working-directory: automation
        env:
          AJ_ID:       ${{ secrets.AJ_ID }}
          AJ_PASSWORD: ${{ secrets.AJ_PASSWORD }}
          SLOT_DATE:  ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:  ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          SLOT_DELTA: ${{ github.event.client_payload.slot_delta || github.event.inputs.slot_delta }}
          SLOT_TARGET_STOCK: ${{ github.event.client_payload.slot_target_stock || github.event.inputs.slot_target_stock }}
          DRY_RUN:    ${{ github.event.client_payload.dry_run || github.event.inputs.dry_run || 'true' }}
          DIAG_FIELDS: ${{ github.event.inputs.diag_fields || 'false' }}
          HEADLESS:   "true"
        run: node reduce-aj-slot.js

      - name: Upload run log & screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aj-artifacts-${{ github.run_id }}
          path: |
            automation/run-log-aj.jsonl
            automation/result-aj.png
            automation/error-aj.png
          if-no-files-found: ignore

      - name: Notify failure to LINE
        if: failure() && github.event.inputs.diag_fields != 'true' && github.event.inputs.notify != 'false'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER:  ${{ secrets.LINE_USER_ID }}
          SLOT_DATE:  ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:  ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          SLOT_DELTA: ${{ github.event.client_payload.slot_delta || github.event.inputs.slot_delta }}
          SOURCE_SITE: ${{ github.event.client_payload.source_site }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LINE_TOKEN" ] || [ -z "$LINE_USER" ]; then
            echo "LINE未設定のため通知スキップ"; exit 0
          fi
          TEXT="🚨【至急】アクティビティジャパン在庫の連動に失敗しました\n対象: ${SLOT_DATE} ${SLOT_TIME} ${SLOT_DELTA}名（発生元: ${SOURCE_SITE}）\n影響: AJの在庫が変わっていない可能性 → オーバーブッキング懸念\n👉 AJ管理画面で在庫を手動調整してください\nログ: ${RUN_URL}"
          PAYLOAD=$(jq -nc --arg to "$LINE_USER" --arg text "$TEXT" '{to:$to, messages:[{type:"text", text:$text}]}')
          curl -sS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
