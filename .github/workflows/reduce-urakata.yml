name: Reduce Urakata Slot

# GAS から repository_dispatch(reduce_urakata) で呼び出される。
# 予約が入ったとき、ウラカタ(=アソビュー=Web予約)の該当枠を増減する。
on:
  repository_dispatch:
    types: [reduce_urakata]
  workflow_dispatch:
    inputs:
      slot_date:  { description: "対象日 (YYYY-MM-DD)", required: true }
      slot_time:  { description: "対象時間 (HH:MM)",    required: true }
      slot_delta: { description: "増減（-2=減 / +2=戻し）", required: false }
      slot_target_stock: { description: "絶対値：目標在庫（指定時はdelta無視）", required: false }
      dry_run:    { description: "true=保存しない",     required: false, default: "true" }

concurrency:
  group: ota-sync-urakata
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo   # 枠の日付は日本時間で判定する
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Adjust slot (urakata)
        working-directory: automation
        env:
          URKT_ID:       ${{ secrets.URKT_ID }}
          URKT_PASSWORD: ${{ secrets.URKT_PASSWORD }}
          GAS_RECONCILE_URL: ${{ secrets.GAS_RECONCILE_URL }}
          RECONCILE_TOKEN:   ${{ secrets.RECONCILE_TOKEN }}
          SLOT_DATE:  ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:  ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          SLOT_DELTA: ${{ github.event.client_payload.slot_delta || github.event.inputs.slot_delta }}
          SLOT_TARGET_STOCK: ${{ github.event.client_payload.slot_target_stock || github.event.inputs.slot_target_stock }}
          DRY_RUN:    ${{ github.event.client_payload.dry_run || github.event.inputs.dry_run || 'true' }}
          HEADLESS:   "true"
        run: node reduce-urakata-slot.js

      - name: Upload run log & screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: urakata-artifacts-${{ github.run_id }}
          path: |
            automation/run-log-urakata.jsonl
            automation/result-urakata.png
            automation/error-urakata.png
          if-no-files-found: ignore

      - name: Notify failure to LINE
        if: failure()
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER:  ${{ secrets.LINE_USER_ID }}
          SLOT_DATE:  ${{ github.event.client_payload.slot_date || github.event.inputs.slot_date }}
          SLOT_TIME:  ${{ github.event.client_payload.slot_time || github.event.inputs.slot_time }}
          SLOT_DELTA: ${{ github.event.client_payload.slot_delta || github.event.inputs.slot_delta }}
          SOURCE_SITE: ${{ github.event.client_payload.source_site }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LINE_TOKEN" ] || [ -z "$LINE_USER" ]; then
            echo "LINE未設定のため通知スキップ"; exit 0
          fi
          TEXT="🚨【至急】ウラカタ(アソビュー)在庫の連動に失敗しました\n対象: ${SLOT_DATE} ${SLOT_TIME} ${SLOT_DELTA}名（発生元: ${SOURCE_SITE}）\n影響: 在庫が変わっていない可能性 → オーバーブッキング懸念\n👉 ウラカタ管理画面で在庫を手動調整してください\nログ: ${RUN_URL}"
          PAYLOAD=$(jq -nc --arg to "$LINE_USER" --arg text "$TEXT" '{to:$to, messages:[{type:"text", text:$text}]}')
          curl -sS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
